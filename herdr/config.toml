onboarding = false

# 启用 herdr 本地 kitty 图片渲染（icat / yazi 预览等终端内图片依赖此开关）
[experimental]
kitty_graphics = true

[theme]
name = "terminal"

auto_switch = false
[ui.sound]
enabled = true

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true

[keys]
prefix = "ctrl+space"
previous_tab = "alt+ctrl+h"
next_tab = "alt+ctrl+l"
next_workspace = "alt+ctrl+j"
previous_workspace = "alt+ctrl+k"
split_vertical = "prefix+|"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "alt+f"
type = "plugin_action"
command = "herdr-floax.toggle"
description = "Toggle floating pane"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "open plugin manager"

# Ctrl+H/J/K/L → herdr-splits plugin: routes to Neovim when in a Neovim pane,
# otherwise focuses the adjacent herdr pane.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"

[[keys.command]]
key = "alt+left"
type = "plugin_action"
command = "herdr-splits.resize-left"

[[keys.command]]
key = "alt+down"
type = "plugin_action"
command = "herdr-splits.resize-down"

[[keys.command]]
key = "alt+up"
type = "plugin_action"
command = "herdr-splits.resize-up"

[[keys.command]]
key = "alt+right"
type = "plugin_action"
command = "herdr-splits.resize-right"
